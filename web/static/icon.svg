<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b253b" />
      <stop offset="50%" stop-color="#0c1427" />
      <stop offset="100%" stop-color="#060a14" />
    </linearGradient>

    <!-- Gopher Cyan Gradient -->
    <linearGradient id="gopherCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6beeff" />
      <stop offset="60%" stop-color="#00add8" />
      <stop offset="100%" stop-color="#008ba8" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Gopher Cyan Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#gopherCyan)" stroke-width="12" />

  <!-- Outer Radar / Scanning Ring Arcs -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00add8" stroke-width="3" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="85" fill="none" stroke="#00add8" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="50" fill="none" stroke="#6beeff" stroke-width="3" stroke-opacity="0.6" filter="url(#softGlow)" />

  <!-- Spokes (Network Links) -->
  <!-- Cardinal Spoke Lines (Up, Right, Down, Left) -->
  <line x1="256" y1="256" x2="256" y2="120" stroke="#f9f6ef" stroke-width="7" stroke-linecap="round" />
  <line x1="256" y1="256" x2="392" y2="256" stroke="#f9f6ef" stroke-width="7" stroke-linecap="round" />
  <line x1="256" y1="256" x2="256" y2="392" stroke="#f9f6ef" stroke-width="7" stroke-linecap="round" />
  <line x1="256" y1="256" x2="120" y2="256" stroke="#f9f6ef" stroke-width="7" stroke-linecap="round" />

  <!-- Diagonal Spoke Lines (Cyan Links) -->
  <line x1="256" y1="256" x2="352" y2="160" stroke="#00add8" stroke-width="8" stroke-linecap="round" filter="url(#softGlow)" />
  <line x1="256" y1="256" x2="352" y2="352" stroke="#00add8" stroke-width="8" stroke-linecap="round" filter="url(#softGlow)" />
  <line x1="256" y1="256" x2="160" y2="352" stroke="#00add8" stroke-width="8" stroke-linecap="round" filter="url(#softGlow)" />
  <line x1="256" y1="256" x2="160" y2="160" stroke="#00add8" stroke-width="8" stroke-linecap="round" filter="url(#softGlow)" />

  <!-- Satellite Signal Arcs -->
  <!-- Top Node Arcs -->
  <path d="M 232 100 A 26 26 0 0 1 280 100" fill="none" stroke="#00add8" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M 222 86 A 38 38 0 0 1 290 86" fill="none" stroke="#00add8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- Bottom Node Arcs -->
  <path d="M 232 412 A 26 26 0 0 0 280 412" fill="none" stroke="#00add8" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M 222 426 A 38 38 0 0 0 290 426" fill="none" stroke="#00add8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- Right Node Arcs -->
  <path d="M 412 232 A 26 26 0 0 1 412 280" fill="none" stroke="#00add8" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M 426 222 A 38 38 0 0 1 426 290" fill="none" stroke="#00add8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- Left Node Arcs -->
  <path d="M 100 232 A 26 26 0 0 0 100 280" fill="none" stroke="#00add8" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M 86 222 A 38 38 0 0 0 86 290" fill="none" stroke="#00add8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- Diagonal Satellite Arcs -->
  <!-- Top-Right -->
  <path d="M 345 130 A 28 28 0 0 1 382 167" fill="none" stroke="#6beeff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75" />
  <!-- Bottom-Right -->
  <path d="M 382 345 A 28 28 0 0 1 345 382" fill="none" stroke="#6beeff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75" />
  <!-- Bottom-Left -->
  <path d="M 167 382 A 28 28 0 0 1 130 345" fill="none" stroke="#6beeff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75" />
  <!-- Top-Left -->
  <path d="M 130 167 A 28 28 0 0 1 167 130" fill="none" stroke="#6beeff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- Outer Satellite Nodes (Alternating Cream & Cyan) -->
  <!-- Cardinal Nodes (Warm Gopher Cream) -->
  <circle cx="256" cy="120" r="16" fill="#f9f6ef" stroke="#0c1427" stroke-width="4" />
  <circle cx="392" cy="256" r="16" fill="#f9f6ef" stroke="#0c1427" stroke-width="4" />
  <circle cx="256" cy="392" r="16" fill="#f9f6ef" stroke="#0c1427" stroke-width="4" />
  <circle cx="120" cy="256" r="16" fill="#f9f6ef" stroke="#0c1427" stroke-width="4" />

  <!-- Diagonal Nodes (Vivid Cyan) -->
  <circle cx="352" cy="160" r="19" fill="url(#gopherCyan)" stroke="#0c1427" stroke-width="4" filter="url(#softGlow)" />
  <circle cx="352" cy="352" r="19" fill="url(#gopherCyan)" stroke="#0c1427" stroke-width="4" filter="url(#softGlow)" />
  <circle cx="160" cy="352" r="19" fill="url(#gopherCyan)" stroke="#0c1427" stroke-width="4" filter="url(#softGlow)" />
  <circle cx="160" cy="160" r="19" fill="url(#gopherCyan)" stroke="#0c1427" stroke-width="4" filter="url(#softGlow)" />

  <!-- Central Hub (Primary Golang Cyan Glow) -->
  <circle cx="256" cy="256" r="38" fill="url(#gopherCyan)" stroke="#ffffff" stroke-width="6" filter="url(#glow)" />
  <circle cx="244" cy="244" r="9" fill="#ffffff" fill-opacity="0.65" />
</svg>
